name: Feature Request / RFC
description: Propose a new feature or change to the TOON specification
title: '[RFC]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check [.out-of-scope](https://github.com/toon-format/spec/tree/main/.out-of-scope) first – it records proposals that were already declined.

  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The problem this solves, and why the current specification can't.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: The same data as TOON today and as TOON with your change.
      placeholder: |
        Before:

        ```toon
        ```

        After:

        ```toon
        ```
    validations:
      required: true
