name: Specification Clarification
description: Ask what a part of the specification means
title: '[Clarification]: '
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section
      placeholder: §9.3
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: A TOON document your question is about.
      placeholder: |
        ```toon
        users[2]{id,name}:
          1,Ada
          2,Bob
        ```
    validations:
      required: true
