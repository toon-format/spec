name: Bug Report
description: Report an error, contradiction, or ambiguity in the TOON specification
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What the specification says, and what it should say instead.
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Section
      placeholder: §9.3
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: A TOON document that shows the issue.
      placeholder: |
        ```toon
        users[2]{id,name}:
          1,Ada
          2,Bob
        ```
